edition = "2024"
max_width = 100
tab_spaces = 4
use_small_heuristics = "Default"
newline_style = "Auto"
# 以下配置需要 nightly Rust（rustfmt --unstable-features）。
# 在 stable 工具链上会被忽略并产生警告，但不影响格式化结果。
# 启用 nightly 后取消注释即可生效。
# indent_style = "Block"
# wrap_comments = true
# format_code_in_doc_comments = true
# normalize_doc_attributes = true
# format_strings = true
# group_imports = "StdExternalCrate"
# imports_granularity = "Crate"
reorder_imports = true
