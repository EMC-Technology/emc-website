[package]
name = "knowledge-core"
description = "Core domain logic for fully-structured knowledge system — BM25 search, hybrid retrieval, Leiden community detection, CQRS+ES, ABAC engine, PII scanner, AES-256-GCM crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["knowledge-graph", "search", "cqrs", "abac", "encryption"]
categories = ["database", "text-processing"]

[features]
default = ["db"]
db = ["dep:surrealdb"]
event-driven = []

# 向量数据库后端（RAG 引擎）
qdrant = ["dep:qdrant-client", "dep:tonic"]
hnswlib = []  # HNSWLIB 适配器无额外依赖（纯内存实现）

# KMS 后端支持
kms-local = []  # 本地文件系统 KMS（默认可用）
kms-aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-runtime", "dep:aws-sdk-sts"]  # AWS KMS
kms-vault = ["dep:vaultrs"]  # HashiCorp Vault

# PII 脱敏
pii = ["dep:fancy-regex"]

# 审计增强
audit-enhanced = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
error-core = { workspace = true, features = ["serde", "uuid", "chrono", "serde-json", "db"] }
blake3 = { workspace = true }
aes-gcm = { workspace = true, default-features = false, features = ["aes", "alloc", "getrandom"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
rand = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
surrealdb = { version = "1.3", optional = true, default-features = false, features = ["kv-mem", "protocol-ws"] }
async-trait = { workspace = true }
dirs = { version = "5", default-features = false }
tokio = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
once_cell = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
dashmap = { version = "5.5", default-features = false }

# 缓存依赖
moka = { workspace = true }
redis = { workspace = true }
bincode = { workspace = true }
metrics = { workspace = true }

# 向量数据库依赖
qdrant-client = { workspace = true, optional = true }
tonic = { version = "0.11", default-features = false, optional = true }

# KMS / 密钥管理依赖
ring = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

# AWS SDK (可选)
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-smithy-runtime = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }

# HashiCorp Vault (可选)
vaultrs = { workspace = true, optional = true }

# PII 脱敏依赖
fancy-regex = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"
proptest = { version = "1.4", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }
lru = { workspace = true }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false
