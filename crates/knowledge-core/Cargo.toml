[package]
name = "knowledge-core"
description = "Core domain logic for fully-structured knowledge system — BM25 search, hybrid retrieval, Leiden community detection, CQRS+ES, ABAC engine, PII scanner, AES-256-GCM crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords = ["knowledge-graph", "search", "cqrs", "abac", "encryption"]
categories = ["database", "text-processing"]

[features]
default = ["db", "kms-local", "pii"]
db = ["dep:surrealdb"]
event-driven = []

# 向量数据库后端（RAG 引擎）
qdrant = ["dep:qdrant-client", "dep:tonic"]
hnswlib = []  # HNSWLIB 适配器无额外依赖（纯内存实现）

# KMS 后端支持
kms-local = ["dep:lru"]  # 本地文件系统 KMS（默认可用）
kms-aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-runtime", "dep:aws-sdk-sts"]  # AWS KMS
kms-vault = ["dep:vaultrs"]  # HashiCorp Vault

# PII 脱敏
pii = ["dep:fancy-regex"]

# Candle 本地 Cross-Encoder 推理
reranker-local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

# CUDA GPU 加速（需安装 CUDA toolkit）
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "candle-transformers?/cuda"]

# Apple Metal 加速（macOS M1/M2/M3）
metal = ["candle-core?/metal", "candle-nn?/metal", "candle-transformers?/metal"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
error-core = { workspace = true, features = ["serde", "uuid", "chrono", "serde-json", "db"] }
blake3 = { workspace = true }
aes-gcm = { workspace = true, default-features = false, features = ["aes", "alloc", "getrandom"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
rand = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
surrealdb = { version = "1.3", optional = true, default-features = false, features = ["kv-mem", "protocol-ws"] }
async-trait = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }

# 缓存依赖
moka = { workspace = true }
redis = { workspace = true }
bincode = { workspace = true }
metrics = { workspace = true }

# 向量数据库依赖
qdrant-client = { workspace = true, optional = true }
tonic = { version = "0.12", default-features = false, optional = true }

# KMS / 密钥管理依赖
ring = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
lru = { workspace = true, optional = true }

# AWS SDK (可选)
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-smithy-runtime = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }

# HashiCorp Vault (可选)
vaultrs = { workspace = true, optional = true }

# PII 脱敏依赖
fancy-regex = { workspace = true, optional = true }

# Candle ML 推理框架 — Cross-Encoder 本地推理
# 与 knowledge-api 保持相同版本策略：0.10 兼容 rand 0.9 + tokenizers 0.22
candle-core = { version = "0.10", default-features = false, features = [], optional = true }
candle-nn = { version = "0.10", default-features = false, features = [], optional = true }
candle-transformers = { version = "0.10", default-features = false, features = [], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["http"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"
proptest = { version = "1.4", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "database_bench"
harness = false
