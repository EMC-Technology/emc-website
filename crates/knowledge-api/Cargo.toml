[package]
name = "knowledge-api"
description = "HTTP/WebSocket/MCP API server for fully-structured knowledge system — GEMMA4-E4B Rust inference, RAG engine, ReAct Agent, ABAC policy engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords = ["rag", "mcp", "llm", "agent", "candle"]
categories = ["web-programming", "database"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
surrealdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
error-core = { workspace = true, features = ["serde", "uuid", "chrono", "db", "serde-json", "jsonwebtoken"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-jaeger = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
prometheus = { workspace = true }
once_cell = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
jsonwebtoken = { workspace = true }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
chrono = { workspace = true }
http-body-util = { version = "0.1", default-features = false }
uuid = { workspace = true }
futures = { workspace = true }  # 用于 RAG 流式输出 (SSE)
tokio-stream = { version = "0.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
argon2 = { version = "0.5", default-features = false, features = ["std"] }
password-hash = { version = "0.5", default-features = false }
rand = { workspace = true }
hex = { workspace = true }

urlencoding = { version = "2.1", default-features = false }

knowledge-core = { path = "../knowledge-core", version = "0.2.0" }
knowledge-parser = { path = "../knowledge-parser", version = "0.2.0" }
ullm = { path = "../ullm", version = "0.2.0", optional = true }
blake3 = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
petgraph = { workspace = true }

# 企业级 MCP Hub 依赖
dashmap = { workspace = true }
lru = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

# proc-macro 支持 (用于 MCP 动态工具注册)
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "extra-traits"] }
quote = { version = "1.0", default-features = false }

# 零信任安全架构依赖（Cedar 策略引擎 / RBAC / mTLS）
regex = { workspace = true }
x509-parser = { version = "0.16", default-features = false }

# Candle ML推理框架 - GEMMA 4.0 E4B 嵌入模型支持
# 核心组件：模型加载、前向传播、量化支持
# 使用 0.10 版本以兼容 rand 0.9 和 tokenizers 0.22
# 注意：candle-core 0.10 默认依赖 objc2-metal（macOS 平台），在 Windows/Linux 上会导致编译错误。
# 通过精确控制 feature 避免引入平台不兼容依赖。
candle-core = { version = "0.10", default-features = false, features = [] }
candle-nn = { version = "0.10", default-features = false, features = [] }
# Transformer架构实现（GEMMA/Llama/Qwen/Mistral等）
# candle-transformers 默认会引入 candle-flash-attn，后者需要 nvcc 编译 CUDA 内核。
# 在 Windows 开发环境中，若未安装 Visual Studio 的 C++ 编译器（cl.exe），nvcc 会报错。
# 因此默认禁用 flash-attn，仅在显式启用 cuda feature 时通过 flash-attn feature 引入。
candle-transformers = { version = "0.10", default-features = false, features = [] }
# 分词器（SentencePiece/BPE/WordPiece）
# 启用 http feature 以避免 onig 系统依赖，使用纯 Rust 实现
tokenizers = { version = "0.22", default-features = false, features = ["http"] }
# HuggingFace Hub模型下载
hf-hub = { version = "0.4", default-features = false, features = ["tokio"] }
# SHA256校验（模型下载完整性验证）
sha2 = { workspace = true }
# 目录路径解析（模型缓存目录）
dirs = { workspace = true }
# 安全内存擦除（JWT 密钥零化）
zeroize = { workspace = true }

[features]
default = ["db"]
db = ["knowledge-core/db"]
ullm-adapter = ["ullm"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
flash-attn = ["candle-transformers/flash-attn"]
event-driven = ["knowledge-core/event-driven"]

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.8", default-features = false }
tower = { version = "0.4", default-features = false, features = ["util"] }
http-body-util = { version = "0.1", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[[bench]]
name = "api_bench"
harness = false

[[bench]]
name = "embedding_bench"
harness = false

[lints]
workspace = true
