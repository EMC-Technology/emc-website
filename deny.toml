[graph]

[advisories]
ignore = [
    "RUSTSEC-2025-0009",  # ring AES overflow panic — 本项目使用 ring 0.17+（已修补），且不使用 QUIC HeaderProtectionKey；AES-GCM 加密不超过 64GB 单块
    "RUSTSEC-2025-0010",  # ring <0.17 不再维护 — 本项目使用 ring 0.17+，不受影响（unaffected: >=0.17）
    "RUSTSEC-2023-0071",  # openssl X509StoreRef UUF — 本项目不直接使用 openssl 的 objects() API
    "RUSTSEC-2024-0370",  # rustls DoS — 本项目不使用 rustls 作为 TLS 服务端
    "RUSTSEC-2024-0436",  # paste 不再维护 — 间接依赖，无安全风险，待上游 crate 迁移至 pastey
    "RUSTSEC-2025-0123",  # opentelemetry-jaeger 不再维护 — 待迁移至 opentelemetry-otlp + jaeger-propagator
    "RUSTSEC-2023-0089",  # regex 栈溢出 — 本项目仅使用硬编码正则，不受不可信输入影响
    "RUSTSEC-2025-0141",  # bincode 不再维护 — 待迁移至 postcard 或 rkyv
    "RUSTSEC-2025-0119",  # number_prefix 不再维护 — 间接依赖，无安全风险
    "RUSTSEC-2024-0358",  # object_store AWS WebIdentityToken 日志泄露 — 本项目不使用 object_store crate
    "RUSTSEC-2026-0104",  # rustls-webpki CRL 解析 panic — 本项目不解析证书吊销列表
    "RUSTSEC-2025-0134",  # rustls-pemfile 不再维护 — 间接依赖（tonic → qdrant-client），待上游迁移至 rustls-pki-types PemObject
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BUSL-1.1",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
    "CC-BY-SA-4.0",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "ar_archive_writer"
version = "*"

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://crates.io", "https://github.com/rust-lang/crates.io-index"]
