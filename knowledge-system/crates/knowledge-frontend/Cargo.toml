[package]
name = "knowledge-frontend"
version = "0.1.0"
edition = "2024"
authors = ["武汉质能科技有限公司（EMC）"]
description = "Dioxus WASM 前端 — CRUD + 图谱可视化"
homepage = "https://github.com/EMC-Technology/emc-website"
repository = "https://github.com/EMC-Technology/emc-website"
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.5.4", features = ["web"] }
dioxus-router = "0.5.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
