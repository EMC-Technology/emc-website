[package]
name = "knowledge-api"
version = "0.1.0"
edition = "2024"
authors = ["武汉质能科技有限公司（EMC）"]
description = "HTTP/WebSocket/MCP API — GEMMA4 推理、Agent、ABAC"
homepage = "https://github.com/EMC-Technology/emc-website"
repository = "https://github.com/EMC-Technology/emc-website"
license = "MIT OR Apache-2.0"

[dependencies]
error-core = { path = "../error-core" }
knowledge-core = { path = "../knowledge-core" }
knowledge-parser = { path = "../knowledge-parser" }
async-trait = "0.1.77"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.40"
axum = "0.7.5"
reqwest = "0.11.24"
tower-http = { version = "0.5.2", features = ["cors"] }
websocket = "0.27.0"
tokio = { version = "1.36", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4.4"
proptest = "1.4.0"
criterion = "0.5.1"
