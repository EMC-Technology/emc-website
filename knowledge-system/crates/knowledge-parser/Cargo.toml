[package]
name = "knowledge-parser"
version = "0.1.0"
edition = "2024"
authors = ["武汉质能科技有限公司（EMC）"]
description = "确定性解析流水线 — DAG 编排、Markdown/Code 双分支"
homepage = "https://github.com/EMC-Technology/emc-website"
repository = "https://github.com/EMC-Technology/emc-website"
license = "MIT OR Apache-2.0"

[dependencies]
error-core = { path = "../error-core" }
knowledge-core = { path = "../knowledge-core" }
async-trait = "0.1.77"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-test = "0.4.4"
proptest = "1.4.0"
criterion = "0.5.1"
