[package]
name = "error-core"
version = "0.1.0"
edition = "2024"
authors = ["武汉质能科技有限公司（EMC）"]
description = "统一错误处理核心库 — 四维分类指纹、错误码注册表、恢复状态机"
homepage = "https://github.com/EMC-Technology/emc-website"
repository = "https://github.com/EMC-Technology/emc-website"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1.77"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tracing = "0.1.40"
thiserror = "1.0.56"
anyhow = "1.0.79"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-test = "0.4.4"
proptest = "1.4.0"
criterion = "0.5.1"
