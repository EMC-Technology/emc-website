# =============================================================================
# 文本全结构化知识系统 - Docker Compose 配置
# =============================================================================
# 使用方式:
#   docker-compose up -d          # 启动所有服务
#   docker-compose logs -f api    # 查看 API 日志
#   docker-compose down           # 停止所有服务
# =============================================================================

services:
  # ---------------------------------------------------------------------
  # SurrealDB 图数据库
  # ---------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    container_name: knowledge-surrealdb
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8002:8002"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=${SURREALDB_PASSWORD:-root_password_change_me_in_production}
      - SURREAL_DB=knowledge
      - SURREAL_PATH=file:///data
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "surreal", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - knowledge-net

  # ---------------------------------------------------------------------
  # Knowledge API 服务
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: knowledge-api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - CONFIG__DATABASE__ADDR=ws://surrealdb:8000
      - CONFIG__DATABASE__NAMESPACE=knowledge
      - CONFIG__DATABASE__DATABASE=knowledge
      - CONFIG__DATABASE__USER=root
      - CONFIG__DATABASE__PASSWORD=${SURREALDB_PASSWORD:-root_password_change_me_in_production}
      - CONFIG__SERVER__HOST=0.0.0.0
      - CONFIG__SERVER__PORT=3000
      - CONFIG__SECURITY__JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production_min_32_chars}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - knowledge-net

  # ---------------------------------------------------------------------
  # Prometheus 监控 (可选)
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: knowledge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring
    networks:
      - knowledge-net

  # ---------------------------------------------------------------------
  # Grafana 可视化 (可选)
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: knowledge-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    profiles:
      - monitoring
    networks:
      - knowledge-net

# ---------------------------------------------------------------------
# 网络定义
# ---------------------------------------------------------------------
networks:
  knowledge-net:
    driver: bridge

# ---------------------------------------------------------------------
# 卷定义
# ---------------------------------------------------------------------
volumes:
  surrealdb-data:
  prometheus-data:
  grafana-data:
