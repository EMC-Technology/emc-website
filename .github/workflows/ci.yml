name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh
          surreal start --bind 0.0.0.0:8000 --user root --pass root memory &
          sleep 3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: P0 Type Safety Check
        run: cargo clippy --workspace --all-targets -- -D clippy::cast_possible_truncation -D clippy::cast_possible_wrap -D clippy::cast_sign_loss -D clippy::absurd_extreme_comparisons -D unused_comparisons
      - name: P0 Code Organization Check
        run: cargo clippy --workspace --all-targets -- -D clippy::items_after_test_module -D clippy::redundant_closure_for_method_calls -D clippy::redundant_closure

  clippy-per-feature:
    name: Clippy (per-feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check error-core without default features
        run: cargo clippy -p error-core --no-default-features -- -D warnings
      - name: Check knowledge-core with minimal features
        run: cargo clippy -p knowledge-core --no-default-features --features "db" -- -D warnings
      - name: Check knowledge-core with event-driven
        run: cargo clippy -p knowledge-core --no-default-features --features "db,event-driven" -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh
          surreal start --bind 0.0.0.0:8000 --user root --pass root memory &
          sleep 3
      - run: cargo test --workspace
        env:
          SURREALDB_URL: ws://localhost:8000

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p knowledge-frontend --target wasm32-unknown-unknown

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh
          surreal start --bind 0.0.0.0:8000 --user root --pass root memory &
          sleep 3
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        env:
          SURREALDB_URL: ws://localhost:8000
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  doc:
    name: Doc Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  matrix-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p error-core
      - run: cargo test -p knowledge-core --no-default-features
